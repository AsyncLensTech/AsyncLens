[package]
name = "fastapi_lens_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "fastapi_lens_core"
crate-type = ["cdylib"] # Obligatoire pour générer une extension Python (.so / .pyd)

[dependencies]
once_cell = "1.21.4"
pyo3 = { version = "0.30.1", features = ["extension-module", "abi3-py39"] }
serde = { version = "1.0.229", features = ["derive"] }

[profile.release]
opt-level = "s"     # Optimise agressivement pour la taille au lieu de la vitesse ("s" est une alternative)
lto = true          # Active le Link-Time Optimization pour supprimer le code mort à travers les dépendances
codegen-units = 1   # Réduit le parallélisme de compilation pour permettre une meilleure optimisation globale
panic = "abort"     # Supprime la logique de "unwinding" en cas de panic (économise beaucoup d'espace)
strip = true
