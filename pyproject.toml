[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "asynclens"
version = "0.1.2"

description = "A native Rust event loop watchdog for Python Asyncio and AnyIO applications."

readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Guénaël Labois", email = "glabois@gmail.com" }
]
keywords = ["asyncio", "anyio", "fastapi", "rust", "pyo3", "watchdog", "performance", "telemetry"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring"
]
dependencies = []


[project.optional-dependencies]
anyio = ["anyio>=3.0.0"]

[project.urls]
Homepage = "https://github.com/AsyncLensTech/AsyncLens"
Repository = "https://github.com/AsyncLensTech/AsyncLens.git"
"Bug Tracker" = "https://github.com/AsyncLensTech/AsyncLens/issues"

[tool.maturin]
bindings = "pyo3"
module-name = "asynclens._native"


python-source = "python" 

[project.scripts]
asynclens = "asynclens:main"
